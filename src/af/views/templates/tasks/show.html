{% extends "base.html" %}
{% block title %}Task · AF{% endblock %}
{% block content %}
  <h1>Task</h1>
  <p>{{ task.prompt }}</p>
  <p class="answer" data-testid="answer">{{ task.output }}</p>
  <p class="meta">{{ task.intent }} via {{ task.route }} ({{ task.tier }}), verified={{ task.verified }}, reused={{ task.reused }}, trace={{ task.trace_id }}</p>
  <form method="post" action="/tasks/{{ task.id }}">
    <label for="prompt">Replace prompt and re-execute</label>
    <input id="prompt" name="prompt" value="{{ task.prompt }}" required>
    <button type="submit">Update</button>
  </form>
  <form method="post" action="/tasks/{{ task.id }}/delete">
    <button type="submit">Delete</button>
  </form>
{% endblock %}
