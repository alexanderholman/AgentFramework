{% extends "base.html" %}
{% block title %}Tasks · AF{% endblock %}
{% block content %}
  <h1>Tasks</h1>
  {% if tasks %}
    <ol>
      {% for task in tasks %}
        <li><a href="/tasks/{{ task.id }}">{{ task.prompt }}</a> → {{ task.output }}</li>
      {% endfor %}
    </ol>
  {% else %}<p>No persisted tasks yet.</p>{% endif %}
{% endblock %}
