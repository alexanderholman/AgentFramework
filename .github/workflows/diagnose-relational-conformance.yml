name: Materialize relational conformance fix

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      UV_LOCKED: "1"
      UV_PYTHON: "3.12"
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: codex/relational-driver-conformance
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Materialize static-analysis-safe rollback probes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/af/testing/relational.py")
          source = path.read_text(encoding="utf-8")
          marker = (
              "class _ExpectedRollback(RuntimeError):\n"
              "    pass\n\n\n"
          )
          helper = (
              marker
              + "def _trigger_rollback(label: str) -> None:\n"
              + "    raise _ExpectedRollback(label)\n\n\n"
          )
          if source.count(marker) != 1:
              raise SystemExit("unexpected rollback marker")
          if source.count('raise _ExpectedRollback("rollback")') != 1:
              raise SystemExit("unexpected transaction rollback probe")
          if source.count('raise _ExpectedRollback("savepoint")') != 1:
              raise SystemExit("unexpected savepoint rollback probe")
          source = source.replace(marker, helper)
          source = source.replace(
              'raise _ExpectedRollback("rollback")',
              '_trigger_rollback("rollback")',
          )
          source = source.replace(
              'raise _ExpectedRollback("savepoint")',
              '_trigger_rollback("savepoint")',
          )
          path.write_text(source, encoding="utf-8")
          PY
          uv run ruff format src/af/testing/relational.py tests/unit/test_relational_conformance.py
          uv run ruff check --fix src/af/testing/relational.py tests/unit/test_relational_conformance.py
          uv run mypy src

      - name: Create canonical source blob
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/git/blobs" \
            -f content="$(base64 -w0 src/af/testing/relational.py)" \
            -f encoding="base64" \
            --jq '.sha' > relational-conformance-blob-sha.txt

      - name: Upload source blob SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relational-conformance-blob-sha
          path: relational-conformance-blob-sha.txt
          if-no-files-found: error
          retention-days: 1
