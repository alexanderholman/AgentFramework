name: AF Python

on:
  push:
    branches: [master, main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/af_dev.py"
      - "pyproject.toml"
      - "uv.lock"
      - "validate_agents.sh"
      - ".github/copilot-instructions.md"
      - ".github/instructions/**"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/af_dev.py"
      - "pyproject.toml"
      - "uv.lock"
      - "validate_agents.sh"
      - ".github/copilot-instructions.md"
      - ".github/instructions/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: af-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_LOCKED: "1"
      UV_PYTHON: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Run the repeatable AF quality gate
        run: python scripts/af_dev.py --action check --execute
