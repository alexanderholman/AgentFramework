name: AF Python

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: af-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AF_APPEND_ONLY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
      AF_APPEND_ONLY_HEAD_REF: ${{ github.event_name == 'push' && github.event.after || github.sha }}
      AF_APPEND_ONLY_BASE_STRATEGY: ${{ github.event_name == 'push' && 'exact' || 'merge-base' }}
      UV_LOCKED: "1"
      UV_PYTHON: "3.12"
    steps:
      - name: Materialize push before commit
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact event head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'push' && github.event.after || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Run the repeatable AF quality gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/af_dev.py --action check --execute 2>&1 | tee af-quality.log

      - name: Materialize formatter diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics/src/af/messaging diagnostics/tests/unit
          cp src/af/messaging/outbox.py diagnostics/src/af/messaging/
          cp tests/unit/test_transactional_outbox.py diagnostics/tests/unit/
          uv run --no-config --no-env-file --offline --locked --no-sources --extra dev ruff format diagnostics/src/af/messaging/outbox.py diagnostics/tests/unit/test_transactional_outbox.py

      - name: Upload quality-gate diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: af-python-quality-diagnostics
          path: |
            af-quality.log
            diagnostics/src/af/messaging/outbox.py
            diagnostics/tests/unit/test_transactional_outbox.py
          if-no-files-found: error
          retention-days: 1
