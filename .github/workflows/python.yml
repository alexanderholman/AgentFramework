name: AF Python

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: af-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AF_APPEND_ONLY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
      AF_APPEND_ONLY_HEAD_REF: ${{ github.event_name == 'push' && github.event.after || '' }}
      AF_APPEND_ONLY_BASE_STRATEGY: ${{ github.event_name == 'push' && 'exact' || 'merge-base' }}
      UV_LOCKED: "1"
      UV_PYTHON: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure push before and after commits are available
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          import subprocess
          import sys

          base_sha = os.environ["AF_APPEND_ONLY_BASE_REF"]
          head_sha = os.environ["AF_APPEND_ONLY_HEAD_REF"]
          if re.fullmatch(r"[0-9a-f]{40}", base_sha) is None:
              raise SystemExit(f"invalid AF_APPEND_ONLY_BASE_REF: {base_sha!r}")
          if re.fullmatch(r"[0-9a-f]{40}", head_sha) is None or head_sha == "0" * 40:
              raise SystemExit(f"invalid AF_APPEND_ONLY_HEAD_REF: {head_sha!r}")
          if (
              subprocess.run(["git", "cat-file", "-e", f"{head_sha}^{{commit}}"], check=False).returncode
              != 0
          ):
              raise SystemExit(f"missing checked-out push head commit: {head_sha}")
          if subprocess.run(["git", "cat-file", "-e", f"{base_sha}^{{commit}}"], check=False).returncode == 0:
              raise SystemExit(0)
          token = os.environ.get("GITHUB_TOKEN", "")
          if not token:
              raise SystemExit("missing GITHUB_TOKEN for push base fetch")
          authorization = base64.b64encode(f"x-access-token:{token}".encode("utf-8")).decode("ascii")
          fetch = subprocess.run(
              [
                  "git",
                  "-c",
                  f"http.https://github.com/.extraheader=AUTHORIZATION: basic {authorization}",
                  "fetch",
                  "--no-tags",
                  "origin",
                  base_sha,
              ],
              check=False,
          )
          if fetch.returncode != 0:
              raise SystemExit(fetch.returncode)
          raise SystemExit(
              subprocess.run(["git", "cat-file", "-e", f"{base_sha}^{{commit}}"], check=False).returncode
          )
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Run the repeatable AF quality gate
        run: python scripts/af_dev.py --action check --execute
