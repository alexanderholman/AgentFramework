name: AF Python

on:
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: write

concurrency:
  group: af-python-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format test host branch
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Format new Python files
        run: uv run --locked --extra dev ruff format src/af/testing tests/unit/test_testing_application.py

      - name: Commit formatted files
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- src/af/testing tests/unit/test_testing_application.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/af/testing tests/unit/test_testing_application.py
          git commit -m "style(testing): apply ruff formatting"
          git push origin "HEAD:${HEAD_REF}"
