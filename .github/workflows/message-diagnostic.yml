name: AF message diagnostic

on:
  pull_request:
    paths:
      - "src/af/messaging/**"
      - "tests/unit/test_message_envelopes.py"
      - ".github/workflows/message-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact event head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Apply focused fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          envelopes = Path("src/af/messaging/envelopes.py")
          source = envelopes.read_text()
          old = """        kind_value = raw.get(\"kind\")
                  try:
                      kind = EnvelopeKind(kind_value)
          """
          new = """        kind_value = raw.get(\"kind\")
                  if type(kind_value) is not str:
                      raise InvalidMessageEnvelope(\"message kind is invalid\")
                  try:
                      kind = EnvelopeKind(kind_value)
          """
          if old not in source:
              raise SystemExit("expected kind decoder block not found")
          envelopes.write_text(source.replace(old, new, 1))

          tests = Path("tests/unit/test_message_envelopes.py")
          source = tests.read_text()
          replaced = source.replace(
              'match="MessageEnvelope.create"',
              'match=r"MessageEnvelope\\.create"',
          )
          if replaced == source:
              raise SystemExit("expected pytest match patterns not found")
          tests.write_text(replaced)
          PY
          uv run ruff format src/af/messaging tests/unit/test_message_envelopes.py
          uv run ruff check src/af/messaging tests/unit/test_message_envelopes.py
          uv run mypy src
          uv run pytest -q tests/unit/test_message_envelopes.py
      - name: Commit focused fixes
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- src/af/messaging tests/unit/test_message_envelopes.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/af/messaging tests/unit/test_message_envelopes.py
          git commit -m "fix(messaging): close lint and type-check gaps"
          git push origin "HEAD:${HEAD_BRANCH}"
