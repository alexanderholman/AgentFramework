name: Materialize pool identity fix

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      UV_LOCKED: "1"
      UV_PYTHON: "3.12"
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: codex/fix-database-pool-driver-identity
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Materialize unique driver identity validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/af/framework/database_pool.py")
          source = path.read_text(encoding="utf-8")
          declaration = "        drivers: list[DatabaseDriver] = []\n"
          append = "                drivers.append(driver)\n"
          if source.count(declaration) != 1 or source.count(append) != 1:
              raise SystemExit("unexpected database pool constructor")
          source = source.replace(
              declaration,
              declaration + "        driver_ids: set[int] = set()\n",
          )
          source = source.replace(
              append,
              "                driver_id = id(driver)\n"
              "                if driver_id in driver_ids:\n"
              "                    raise ValueError(\n"
              "                        \"database pool factory returned a duplicate driver instance\"\n"
              "                    )\n"
              + append
              + "                driver_ids.add(driver_id)\n",
          )
          path.write_text(source, encoding="utf-8")
          PY
          uv run ruff format src/af/framework/database_pool.py tests/unit/test_database_pool_identity.py
          uv run ruff check --fix src/af/framework/database_pool.py tests/unit/test_database_pool_identity.py

      - name: Create canonical source blob
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/git/blobs" \
            -f content="$(base64 -w0 src/af/framework/database_pool.py)" \
            -f encoding="base64" \
            --jq '.sha' > database-pool-blob-sha.txt

      - name: Upload source blob SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-pool-blob-sha
          path: database-pool-blob-sha.txt
          if-no-files-found: error
          retention-days: 1
