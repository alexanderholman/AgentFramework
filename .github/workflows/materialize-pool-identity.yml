name: Materialize pool identity fix

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      UV_LOCKED: "1"
      UV_PYTHON: "3.12"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Materialize unique driver identity validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/af/framework/database_pool.py")
          source = path.read_text(encoding="utf-8")
          old = '''        drivers: list[DatabaseDriver] = []
          try:
              for _ in range(size):
                  driver = factory()
                  if not self._is_driver(driver):
                      raise TypeError("database pool factory returned an invalid driver")
                  drivers.append(driver)
          '''
          new = '''        drivers: list[DatabaseDriver] = []
          driver_ids: set[int] = set()
          try:
              for _ in range(size):
                  driver = factory()
                  if not self._is_driver(driver):
                      raise TypeError("database pool factory returned an invalid driver")
                  driver_id = id(driver)
                  if driver_id in driver_ids:
                      raise ValueError(
                          "database pool factory returned a duplicate driver instance"
                      )
                  drivers.append(driver)
                  driver_ids.add(driver_id)
          '''
          if source.count(old) != 1:
              raise SystemExit("unexpected database pool constructor")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          uv run ruff format src/af/framework/database_pool.py tests/unit/test_database_pool_identity.py
          uv run ruff check --fix src/af/framework/database_pool.py tests/unit/test_database_pool_identity.py

      - name: Create canonical source blob
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/git/blobs" \
            -f content="$(base64 -w0 src/af/framework/database_pool.py)" \
            -f encoding="base64" \
            --jq '.sha' > database-pool-blob-sha.txt

      - name: Upload source blob SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-pool-blob-sha
          path: database-pool-blob-sha.txt
          if-no-files-found: error
          retention-days: 1
