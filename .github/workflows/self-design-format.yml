name: AF Self Design Format Capture

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/self-design-format.yml
      - src/af/framework/self_design.py
      - tests/unit/test_self_design.py

permissions:
  contents: read

jobs:
  capture:
    name: Capture canonical self-design slice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact event head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Apply canonical formatter and safe lint fixes
        run: |
          uv run ruff format \
            src/af/framework/self_design.py \
            tests/unit/test_self_design.py
          uv run ruff check --fix \
            src/af/framework/self_design.py \
            tests/unit/test_self_design.py
          git diff -- \
            src/af/framework/self_design.py \
            tests/unit/test_self_design.py \
            > self-design-format.patch

      - name: Verify bounded slice
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            uv run ruff format --check \
              src/af/framework/self_design.py \
              tests/unit/test_self_design.py
            uv run ruff check \
              src/af/framework/self_design.py \
              tests/unit/test_self_design.py
            uv run mypy src/af/framework/self_design.py
            uv run pytest -q tests/unit/test_self_design.py
          } 2>&1 | tee self-design-verify.log

      - name: Upload canonical bounded slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: self-design-format
          path: |
            self-design-format.patch
            self-design-verify.log
            src/af/framework/self_design.py
            tests/unit/test_self_design.py
          if-no-files-found: error
          retention-days: 1
