name: AF Self Design Format Apply

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/self-design-format.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply verified canonical self-design slice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bounded implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/self-design-plan-124
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Format and verify bounded slice
        run: |
          uv run ruff format \
            src/af/framework/self_design.py \
            tests/unit/test_self_design.py
          uv run ruff check --fix \
            src/af/framework/self_design.py \
            tests/unit/test_self_design.py
          uv run ruff format --check \
            src/af/framework/self_design.py \
            tests/unit/test_self_design.py
          uv run ruff check \
            src/af/framework/self_design.py \
            tests/unit/test_self_design.py
          uv run mypy src/af/framework/self_design.py
          uv run pytest -q tests/unit/test_self_design.py

      - name: Commit only the verified bounded result
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/af/framework/self_design.py \
            tests/unit/test_self_design.py
          git rm .github/workflows/self-design-format.yml
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/self-design-format.yml
            src/af/framework/self_design.py
            tests/unit/test_self_design.py
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected changed paths: %s\n' "${changed[*]}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply canonical self-design formatting"
          git push origin HEAD:agent/self-design-plan-124
