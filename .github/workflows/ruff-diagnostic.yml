name: Temporary Ruff Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Show exact Ruff diagnostics
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${HEAD_SHA}"
          git checkout -q --detach FETCH_HEAD
          python -m pip install -q ruff==0.15.22
          ruff format --check src/af/application/self_design_recording.py src/af/framework/self_design_recording.py src/af/infrastructure/local_self_design_recording.py tests/integration/test_local_self_design_recording.py tests/unit/test_self_design_recording.py
          ruff check --output-format concise src/af/application/self_design_recording.py src/af/framework/self_design_recording.py src/af/infrastructure/local_self_design_recording.py tests/integration/test_local_self_design_recording.py tests/unit/test_self_design_recording.py
