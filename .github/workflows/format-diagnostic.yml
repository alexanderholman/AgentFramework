name: AF format diagnostic

on:
  pull_request:
    paths:
      - "src/af/messaging/**"
      - "tests/unit/test_message_envelopes.py"
      - ".github/workflows/format-diagnostic.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact event head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Format changed Python files
        run: uv run ruff format src/af/messaging tests/unit/test_message_envelopes.py
      - name: Stage formatted artifact
        run: |
          mkdir -p formatted/src/af/messaging formatted/tests/unit
          cp src/af/messaging/*.py formatted/src/af/messaging/
          cp tests/unit/test_message_envelopes.py formatted/tests/unit/
      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-message-envelope
          path: formatted
          if-no-files-found: error
          retention-days: 1
