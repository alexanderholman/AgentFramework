name: AF Testing Diagnostics

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  import-fix:
    name: import-fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_LOCKED: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --extra dev
      - name: Materialize Ruff import fix
        run: |
          uv run ruff check --fix tests/feature/test_testing_fixture_extension.py
          cp tests/feature/test_testing_fixture_extension.py fixed-test_testing_fixture_extension.py
          uv run ruff check tests/feature/test_testing_fixture_extension.py
      - name: Upload fixed source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostic-import-fix
          path: fixed-test_testing_fixture_extension.py
          if-no-files-found: error
