name: AF OpenSearch

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: af-opensearch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: OpenSearch 3.7 search conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      opensearch:
        image: opensearchproject/opensearch:3.7.0@sha256:44ba7ea58a319adf61c33ab16873f9ef5dbb30b291a832d375172f0b2d24e3c9
        env:
          discovery.type: single-node
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      AF_OPENSEARCH_TEST_URL: http://127.0.0.1:9200
      AF_OPENSEARCH_TEST_VERSION: 3.7.0
      UV_LOCKED: "1"
      UV_PYTHON: "3.12"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.event.after || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Check OpenSearch changed slice
        id: quality
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            uv run ruff format --check \
              src/af/search/contracts.py \
              src/af/search/manager.py \
              src/af/search/opensearch.py \
              src/af/search/opensearch_manager.py \
              src/af/testing/conformance.py \
              src/af/testing/search.py \
              tests/unit/test_opensearch_driver.py \
              tests/unit/test_opensearch_manager.py \
              tests/unit/test_search_conformance.py \
              tests/integration/test_opensearch_search.py
            uv run ruff check \
              src/af/search/contracts.py \
              src/af/search/manager.py \
              src/af/search/opensearch.py \
              src/af/search/opensearch_manager.py \
              src/af/testing/conformance.py \
              src/af/testing/search.py \
              tests/unit/test_opensearch_driver.py \
              tests/unit/test_opensearch_manager.py \
              tests/unit/test_search_conformance.py \
              tests/integration/test_opensearch_search.py
            uv run mypy \
              src/af/search/contracts.py \
              src/af/search/manager.py \
              src/af/search/opensearch.py \
              src/af/search/opensearch_manager.py \
              src/af/testing/conformance.py \
              src/af/testing/search.py
            uv run pytest -q \
              tests/unit/test_opensearch_driver.py \
              tests/unit/test_opensearch_manager.py \
              tests/unit/test_search_conformance.py
          } 2>&1 | tee opensearch-quality.log

      - name: Run OpenSearch 3.7 real-service certification
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run --with "opensearch-py==3.2.0" \
            pytest -q tests/integration/test_opensearch_search.py \
            2>&1 | tee opensearch-integration.log

      - name: Run canonical gate without OpenSearch opt-in
        id: canonical
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          unset AF_OPENSEARCH_TEST_URL AF_OPENSEARCH_TEST_VERSION
          python scripts/af_dev.py --action check --execute \
            2>&1 | tee canonical-gate.log

      - name: Upload OpenSearch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opensearch-diagnostics
          path: |
            opensearch-quality.log
            opensearch-integration.log
            canonical-gate.log
            src/af/search/contracts.py
            src/af/search/manager.py
            src/af/search/opensearch.py
            src/af/search/opensearch_manager.py
            src/af/testing/conformance.py
            src/af/testing/search.py
            tests/unit/test_opensearch_driver.py
            tests/unit/test_opensearch_manager.py
            tests/unit/test_search_conformance.py
            tests/integration/test_opensearch_search.py
          if-no-files-found: error
          retention-days: 1

      - name: Enforce OpenSearch checks
        if: >-
          steps.quality.outcome == 'failure' ||
          steps.integration.outcome == 'failure' ||
          steps.canonical.outcome == 'failure'
        run: exit 1

