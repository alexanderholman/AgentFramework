name: Diagnose aggregate quality gate

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Capture aggregate output
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AF_APPEND_ONLY_BASE_REF: ${{ github.event.pull_request.base.sha }}
      AF_APPEND_ONLY_HEAD_REF: ${{ github.sha }}
      AF_APPEND_ONLY_BASE_STRATEGY: merge-base
      UV_LOCKED: "1"
      UV_PYTHON: "3.12"
    steps:
      - name: Check out exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Capture exact aggregate gate
        run: |
          set +e
          python scripts/af_dev.py --action check --execute > aggregate.log 2>&1
          status=$?
          printf '%s\n' "$status" > aggregate-exit.txt
          exit 0

      - name: Upload aggregate diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aggregate-diagnostics
          path: |
            aggregate.log
            aggregate-exit.txt
          if-no-files-found: error
          retention-days: 1
