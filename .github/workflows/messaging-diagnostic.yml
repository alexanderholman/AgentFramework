name: Messaging diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  source-check:
    name: ${{ matrix.check }} ${{ matrix.path }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint]
        path:
          - src/af/messaging/__init__.py
          - src/af/messaging/errors.py
          - src/af/messaging/local_bus.py
          - src/af/messaging/schema.py
          - tests/unit/test_message_schema_and_local_bus.py
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra dev
      - if: matrix.check == 'format'
        run: uv run ruff format --check "${{ matrix.path }}"
      - if: matrix.check == 'lint'
        run: uv run ruff check "${{ matrix.path }}"
