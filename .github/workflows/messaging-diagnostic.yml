name: Messaging diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  source-check:
    name: ${{ matrix.check }} new messaging files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra dev
      - if: matrix.check == 'format'
        run: uv run ruff format --check src/af/messaging tests/unit/test_message_schema_and_local_bus.py
      - if: matrix.check == 'lint'
        run: uv run ruff check src/af/messaging tests/unit/test_message_schema_and_local_bus.py

  typing:
    name: Messaging strict typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra dev
      - run: uv run mypy src/af/messaging

  tests:
    name: Full tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra dev
      - run: uv run pytest --cov=af --cov-report=term-missing --cov-fail-under=90

  release-validate:
    name: Release and append-only validation
    runs-on: ubuntu-latest
    env:
      AF_APPEND_ONLY_BASE_REF: ${{ github.event.pull_request.base.sha }}
      AF_APPEND_ONLY_HEAD_REF: ${{ github.sha }}
      AF_APPEND_ONLY_BASE_STRATEGY: merge-base
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/release_gates.py --action validate
