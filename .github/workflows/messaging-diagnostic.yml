name: Messaging diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  capture:
    name: Capture formatter and lint output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra dev
      - name: Materialize safe formatter and lint fixes
        shell: bash
        run: |
          uv run ruff format src/af/messaging/schema.py tests/unit/test_message_schema_and_local_bus.py
          uv run ruff check --fix src/af/messaging/schema.py tests/unit/test_message_schema_and_local_bus.py > messaging-lint.txt 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: messaging-diagnostic
          path: |
            src/af/messaging/schema.py
            tests/unit/test_message_schema_and_local_bus.py
            messaging-lint.txt
          if-no-files-found: error
          retention-days: 1
