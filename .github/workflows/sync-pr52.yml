name: Approve PR 52 checks

on:
  push:
    branches: [automation/sync-pr52-20260723]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: approve-pr52-checks
  cancel-in-progress: false

jobs:
  approve:
    name: Approve exact PR 52 workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PR head and approve runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: alexanderholman/AgentFramework
          EXPECTED_HEAD: 1f0eec01d93220668847782cf5c63bad66603175
          RUN_IDS: "30041011654 30041011651"
        run: |
          set -euo pipefail
          current_head="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pulls/52" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          if [[ "$current_head" != "$EXPECTED_HEAD" ]]; then
            echo "Refusing stale approval: expected $EXPECTED_HEAD, found $current_head" >&2
            exit 1
          fi

          for run_id in $RUN_IDS; do
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/approve"
          done
