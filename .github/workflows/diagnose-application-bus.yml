name: Diagnose application bus integration

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Exact check-environment commands
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AF_APPEND_ONLY_BASE_REF: ${{ github.event.pull_request.base.sha }}
      AF_APPEND_ONLY_HEAD_REF: ${{ github.sha }}
      AF_APPEND_ONLY_BASE_STRATEGY: merge-base
      UV_LOCKED: "1"
      UV_PYTHON: "3.12"
    steps:
      - name: Check out exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - &exact-command
        name: Exact command 0 - release validation
        continue-on-error: true
        env:
          COMMAND_INDEX: "0"
        run: |
          python - <<'PY'
          import os, runpy, subprocess
          namespace = runpy.run_path("scripts/af_dev.py")
          commands = namespace["ACTIONS"]["check"]
          git = namespace["resolve_locked_git_executable"]()
          commands = namespace["pin_locked_release_tools"](
              commands,
              namespace["resolve_locked_uv_executable"](),
              git,
          )
          command = commands[int(os.environ["COMMAND_INDEX"])]
          raise SystemExit(subprocess.run(command, env=namespace["execution_environment"]("check")).returncode)
          PY

      - <<: *exact-command
        name: Exact command 1 - format
        env:
          COMMAND_INDEX: "1"

      - <<: *exact-command
        name: Exact command 2 - lint
        env:
          COMMAND_INDEX: "2"

      - <<: *exact-command
        name: Exact command 3 - type check
        env:
          COMMAND_INDEX: "3"

      - <<: *exact-command
        name: Exact command 4 - full coverage
        env:
          COMMAND_INDEX: "4"

      - <<: *exact-command
        name: Exact command 5 - node route gate
        env:
          COMMAND_INDEX: "5"

      - <<: *exact-command
        name: Exact command 6 - package
        env:
          COMMAND_INDEX: "6"

      - <<: *exact-command
        name: Exact command 7 - legacy validation
        env:
          COMMAND_INDEX: "7"
