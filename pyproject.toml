[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "af-agent-framework"
version = "0.1.0a0"
description = "AF: a classification-heavy, inference-light agent framework"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Alexander Holman" }]
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1.6,<4",
  "mcp>=1.28.1,<2",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.40,<3",
  "strawberry-graphql[fastapi]>=0.280,<1",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pyyaml>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
af = "af.interfaces.cli:app"
af-mcp = "af.interfaces.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/af"]

[tool.hatch.build.targets.sdist]
include = ["src/af", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["af"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["af"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["strawberry.*", "mcp.*"]
ignore_missing_imports = true
